name: buildtrack_mobile
description: "A new Flutter project."
publish_to: 'none' 
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^8.0.2
  provider: ^6.1.5+1
  image_picker: ^1.0.4
  permission_handler: ^11.3.1
  file_picker: ^8.1.2
  fl_chart: ^0.69.0
  webview_flutter: ^4.7.0      # shows AirPay payment page
  app_links: ^6.0.0            # catches deep link when AirPay redirects back
  pdf: ^3.10.8
  printing: ^5.12.0
  share_plus: 12.0.2
  path_provider: ^2.1.0
  csv: ^6.0.0
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2   # [BT-SEC-05] Keystore/Keychain-backed JWT storage
  http: ^1.6.0
  open_filex: ^4.3.2
  in_app_purchase: ^3.2.0
  speech_to_text: ^7.0.0
  signature: ^6.3.0
  url_launcher: ^6.3.2
  showcaseview: ^5.1.0
  intl: ^0.20.3
  firebase_core: ^3.0.0
  firebase_messaging: ^15.0.0
  flutter_local_notifications: ^17.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/buildtrack_logo.png"
  adaptive_icon_foreground: "assets/icon/buildtrack_logo.png"
  adaptive_icon_background: "#FFFFFF"
  min_sdk_android: 21


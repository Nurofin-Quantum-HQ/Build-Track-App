name: Build Android APK
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          # Pinned: an unpinned "latest stable" broke the release build when
          # material.dart stopped re-exporting CupertinoPageTransitionsBuilder.
          # Bump on purpose after checking `flutter build apk` locally.
          flutter-version: '3.41.9'
          
      - run: yes | flutter doctor --android-licenses
      
      - run: flutter pub get
      - name: Build Flutter APK
        run: flutter build apk --release --build-number=${{ github.run_number }}
      
      - name: Generate Version Metadata
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d '+' -f 1 | tr -d '[:space:]')
          cat <<EOF > version.json
          {
            "version": "$VERSION",
            "buildNumber": ${{ github.run_number }},
            "downloadUrl": "https://github.com/Nurofin-Quantum-HQ/Build-Track-App/releases/latest/download/app-release.apk",
            "releaseNotes": "Latest updates and enhancements for BuildTrack.",
            "forceUpdate": false,
            "publishedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          cat version.json
      
      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: version-metadata
          path: version.json

      - name: Update Latest Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest
          name: Latest Release
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            version.json
          prerelease: false
